# Refresh of the start/sit advisor, several times a week through the fantasy
# playoffs.
#
# WHY THIS EXISTS. Prop lines move all week — most post Wednesday and Thursday
# after the injury reports, and the lines for questionable players often do
# not exist until Sunday morning. A page built on Tuesday is wrong by Sunday.
#
# WHY IT STOPS. The expiry below is enforced in the job. Fantasy playoffs end
# with week 17, and a cron that outlives its purpose keeps rebuilding a site
# for a season that is over.
#
# WHAT IT COSTS. Nothing to run — this repo is public, so Actions minutes are
# free — plus a few cents per run in Amplify build minutes when data changed.
# The sportsbook feed is on a free plan measured in objects per month: one
# game with all its props is one object, a slate is about sixteen, and this
# schedule spends roughly five hundred of the plan's 2,500.
#
# THIS IS THE FIRST WORKFLOW IN THE REPO THAT USES A SECRET. The sportsbook
# feed is keyed. The key is the repository secret SGO_API_KEY, passed to one
# step as an environment variable and sent as a request header; it never
# appears in a URL, a cache filename or a log line. The pick'em tier (Sleeper)
# and everything else in the pipeline is anonymous.

name: Start/Sit refresh

on:
  schedule:
    # 10:00 UTC (6am Eastern) Wednesday through Sunday: after the overnight
    # line moves, before anyone sets a lineup.
    - cron: "0 10 * * 3,4,5,6,0"
    # 15:30 UTC (11:30am Eastern) Sunday: the final snapshot, after the
    # Sunday-morning props post and before the early kickoffs.
    - cron: "30 15 * * 0"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Label the snapshot daily or final"
        type: choice
        options: [daily, final]
        default: daily

concurrency:
  group: start-sit-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  # The Monday after the week 17 games. Past this the job is a no-op.
  EXPIRES_AFTER: "2027-01-05"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Stop if the season is over
        id: window
        run: |
          today=$(date -u +%F)
          if [[ "$today" > "$EXPIRES_AFTER" ]]; then
            echo "::notice::Scheduled window ended $EXPIRES_AFTER. Delete this workflow."
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the snapshot
        if: steps.window.outputs.expired == 'false'
        id: snap
        run: |
          # The 15:30 UTC Sunday run is the final; a manual run says which it is.
          if [[ -n "${{ inputs.snapshot }}" ]]; then
            echo "kind=${{ inputs.snapshot }}" >> "$GITHUB_OUTPUT"
          elif [[ "$(date -u +%u)" == "7" && "$(date -u +%H)" -ge 15 ]]; then
            echo "kind=final" >> "$GITHUB_OUTPUT"
          else
            echo "kind=daily" >> "$GITHUB_OUTPUT"
          fi

      # Full history: the drift gate reads the previous artifacts out of git.
      - uses: actions/checkout@v4
        if: steps.window.outputs.expired == 'false'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.window.outputs.expired == 'false'
        with:
          node-version: "22"
          cache: npm

      - uses: astral-sh/setup-uv@v5
        if: steps.window.outputs.expired == 'false'
        with:
          enable-cache: true
          cache-dependency-glob: projects/start-sit/uv.lock

      - name: Install
        if: steps.window.outputs.expired == 'false'
        run: npm ci

      # projects/start-sit/data/ is deliberately NOT cached: the fetchers reuse
      # a cached file, and a warm cache would let a dead feed be masked by
      # yesterday's bytes. A cold runner is the guard.
      # Exit 78 from the sportsbook fetcher means the month's object ledger is
      # nearly spent: the run steps aside rather than failing, so no issue opens
      # and the Sunday final keeps its budget.
      - name: Fetch the lines
        if: steps.window.outputs.expired == 'false'
        id: fetch
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          SGO_REQUIRE_KEY: "1"
        run: |
          set +e
          npm run start-sit:fetch
          rc=$?
          set -e
          if [[ "$rc" -eq 78 ]]; then
            echo "::notice::Sportsbook object budget nearly spent; this run publishes nothing."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish the artifacts
        if: steps.window.outputs.expired == 'false' && steps.fetch.outputs.skipped != 'true'
        run: |
          cd projects/start-sit
          uv run python ev.py --selftest
          uv run python teams.py --no-verify
          uv run python publish.py --snapshot "${{ steps.snap.outputs.kind }}"

      - name: Gates
        if: steps.window.outputs.expired == 'false' && steps.fetch.outputs.skipped != 'true'
        run: npm run start-sit:check

      - name: Compare against the last good run
        if: steps.window.outputs.expired == 'false' && steps.fetch.outputs.skipped != 'true'
        run: |
          node --experimental-strip-types \
            projects/start-sit/results/day-over-day.mts --require-baseline

      - name: Log the feed budget
        if: steps.window.outputs.expired == 'false' && steps.fetch.outputs.skipped != 'true'
        run: |
          {
            echo "### Start/Sit refresh — week $(jq -r .week public/start-sit/meta.json), ${{ steps.snap.outputs.kind }}"
            echo
            jq -r '"- priced: \(.counts.priced) of \(.counts.pool) (full \(.counts.full), partial \(.counts.partial), TD-only \(.counts.tdOnly))"' public/start-sit/meta.json
            jq -r '"- books: \(.counts.books) · sportsbook stats \(.counts.bookStats) · pick'"'"'em stats \(.counts.dfsStats)"' public/start-sit/meta.json
            jq -r '"- sportsbook ledger: \(.usage.objects) of \(.usage.plan) objects used in \(.usage.month)"' public/start-sit/meta.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        if: steps.window.outputs.expired == 'false' && steps.fetch.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          # PATH-SCOPED. This branch can carry unrelated work in progress, and
          # an unattended `commit -a` would ship it to a live site.
          paths=(public/start-sit)
          # meta.json carries the build time, so it differs every run. Decide
          # on the DATA files only, or every run spends an Amplify build.
          data_changed=$(git status --porcelain -- \
            public/start-sit/players.json \
            public/start-sit/games.json \
            public/start-sit/teams.json)
          if [[ -z "$data_changed" ]]; then
            echo "::notice::No data change. The lines have not moved since the last run."
            git checkout -- "${paths[@]}"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "Start/Sit: week $(jq -r .week public/start-sit/meta.json) ${{ steps.snap.outputs.kind }} refresh for $(date -u +%F)" \
                     -m "Automated rebuild. Gates and day-over-day comparison passed."
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Report a failure
        if: failure() && steps.window.outputs.expired == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = `Start/Sit refresh failed — ${today}`;
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: "all", labels: "start-sit",
            });
            const match = existing.data.find((i) => i.title === title);
            const body = [
              `The scheduled refresh failed. **Nothing was published** — the site is still`,
              `serving the last lines that passed every gate.`,
              ``,
              `[Run log](${url})`,
              ``,
              `Most likely causes, in order: the SGO_API_KEY secret is missing or the feed's`,
              `monthly allowance ran out; Sleeper's lines endpoint changed shape or returned`,
              `no NFL lines; the sportsbook feed renamed a book or a player id format and the`,
              `name-match gate caught it; or the market numbers stopped tracking last season`,
              `and the publisher's sanity check refused them.`,
              ``,
              `To debug locally: \`SGO_API_KEY=... npm run start-sit:daily\``,
            ].join("\n");
            if (match) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: match.number, body });
              if (match.state === "closed") {
                await github.rest.issues.update({ ...context.repo, issue_number: match.number, state: "open" });
              }
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["start-sit"] });
            }
