[project]
name = "engine"
version = "0.1.0"
description = "NFL prospect comparables engine — ingest, features, embeddings, eval"
readme = "README.md"
authors = [
    { name = "Greg Lewis", email = "greghlewis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.42.97",
    "cfbd>=4.5.2",
    "html5lib>=1.1",
    "lxml>=6.1.0",
    "nflreadpy>=0.1.5",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
