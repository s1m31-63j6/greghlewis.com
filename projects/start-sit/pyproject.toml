[project]
name = "start-sit"
version = "0.1.0"
description = "Start/Sit by the betting market — weekly player prop lines turned into market-implied fantasy points."
requires-python = ">=3.12"
dependencies = [
    # Sleeper's players feed and pick'em lines, SportsGameOdds events.
    "httpx>=0.27",
    # nflverse/DynastyProcess CSV mirrors redirect through GitHub.
    "requests>=2.32",
    # Joins across the pool, the crosswalk and two line sources.
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    # 2025 weekly stats for the per-stat spread fit, 2026 schedule, team marks.
    "nflreadpy>=0.1.5",
]

[dependency-groups]
dev = ["ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py312"
