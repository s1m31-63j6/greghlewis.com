# Religious Voices — leader manifest.
#
# Source of truth for both the corpus pipeline (which scrapers to invoke,
# which texts to chunk) and the frontend (dropdown population, sort order).
#
# Sort order: leaders within a religion are displayed sorted by era_start
# ascending. era_start = year their public ministry / publishing career
# meaningfully began (not birth year).
#
# Mormon coverage is intentionally complete (all 18 prophets through Oaks).
# Other traditions follow a ~20-year cadence from 1800-2026 where publicly
# available English-language source material exists.

leaders:

  # -------- Mormon (all prophets, Joseph Smith → Dallin H. Oaks) --------

