[project]
name = "religious-voices-corpus"
version = "0.1.0"
description = "Corpus pipeline for the Religious Voices chatbot — scrape, chunk, embed, emit JSON for the Next.js site."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "boto3>=1.34",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "tiktoken>=0.7",
    "rich>=13.7",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
