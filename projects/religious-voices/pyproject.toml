[project]
name = "religious-voices"
version = "0.3.0"
description = "Religious Voices chatbot — corpus pipeline (scrape → chunk → Bedrock-embed → JSON) for the Next.js SSR runtime."
requires-python = ">=3.11"
dependencies = [
    # Corpus pipeline
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "tiktoken>=0.7",
    "rich>=13.7",
    # Bedrock Cohere embeddings
    "boto3>=1.35",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
