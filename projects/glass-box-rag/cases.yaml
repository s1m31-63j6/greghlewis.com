  - name: Walters v. OpenAI
    reason: |
      The AI-defamation case (ChatGPT hallucinated a false embezzlement claim). Excluded on
      two grounds: it is a Georgia STATE trial-court order, which the corpus's federal
      binding-hierarchy model (common.binds) does not represent, and the only public copy is
      an image-only scan with no machine-extractable text layer — OCR'ing one 3-page order is
      not worth a new dependency. The AI-harms domain is carried by Mobley and Garcia instead.
