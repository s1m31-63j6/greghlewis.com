modern:
  # --- Tier A: the only three actual fair-use merits rulings that exist ---
  - id: ross-2025
    name: Thomson Reuters Enterprise Centre GmbH v. Ross Intelligence Inc.
    citation: 765 F. Supp. 3d 382
    court: ded
    year: 2025
    date: 2025-02-11
    judge: Bibas
    layer: modern
    source: url
    url: https://www.ded.uscourts.gov/sites/ded/files/opinions/20-613_5.pdf
    govinfo_package: USCOURTS-ded-1_20-cv-00613
    note: |
      Fair use REJECTED. Held 2,243 Westlaw headnotes protectable. Non-generative AI.
      Thematically central: the proprietary editorial layer we deliberately exclude is
      the very thing this case is about. 3d Cir. appeal argued 2026-06-11, undecided.

  - id: bartz-2025
    name: Bartz v. Anthropic PBC
    docket: 3:24-cv-05417
    court: cand
    year: 2025
    date: 2025-06-23
    judge: Alsup
    layer: modern
    source: govinfo
    govinfo_package: USCOURTS-cand-3_24-cv-05417
    note: |
      Training "exceedingly transformative" = fair use. Retention of ~7M pirated books
      is NOT. Pairs with Kadrey (2 days later, opposite factor-4 reasoning).

  - id: kadrey-2025
    name: Kadrey v. Meta Platforms, Inc.
    docket: 3:23-cv-03417
    court: cand
    year: 2025
    date: 2025-06-25
    judge: Chhabria
    layer: modern
    source: govinfo
    govinfo_package: USCOURTS-cand-3_23-cv-03417
    note: |
      Fair use found, but ONLY because plaintiffs failed to build a market-dilution
      record. Explicitly says most such cases should come out the other way.
      THE contrast target against Bartz.

  # --- Tier D: 2026, controlling ---
  - id: cox-sony-2026
    name: Cox Communications, Inc. v. Sony Music Entertainment
    citation: 607 U.S. ___
    court: scotus
    year: 2026
    date: 2026-03-25
    judge: Thomas
    layer: modern
    source: url
    url: https://www.supremecourt.gov/opinions/25pdf/24-171_bq7d.pdf
    note: Narrows contributory liability. Now controlling for AI output-infringement theories.

  - id: astm-upcodes-2026
    name: American Society for Testing and Materials v. UpCodes, Inc.
    court: ca3
    year: 2026
    date: 2026-04-07
    layer: modern
    source: url
    url: https://www.lawnext.com/wp-content/uploads/2026/04/aastm_v_upcodes_3d_cir_op.pdf
    note: 3d Cir. ordered supplemental briefing in Ross on this decision's effect. Live bridge.

  # --- Tier B: adjacent doctrine (pleading, DMCA 1202, standing, secondary liability) ---
  - id: nyt-openai-2025
    name: The New York Times Co. v. Microsoft Corp. & OpenAI
    docket: 1:23-cv-11195
    court: nysd
    year: 2025
    date: 2025-04-04
    judge: Stein
    layer: modern
    source: url
    url: https://www.nysd.uscourts.gov/sites/default/files/2025-04/yf%2023cv11195%20OpenAI%20MTD%20opinion%20april%204%202025.pdf
    note: |
      govinfo has ZERO granules for this docket (SDNY doesn't feed GPO), so this comes
      from the court's own site — native text layer, no OCR noise. Consolidated opinion
      covering NYT + Daily News + CIR.

  - id: andersen-2024
    name: Andersen v. Stability AI Ltd.
    docket: 3:23-cv-00201
    court: cand
    year: 2024
    date: 2024-08-12
    judge: Orrick
    layer: modern
    source: govinfo
    govinfo_package: USCOURTS-cand-3_23-cv-00201

  - id: concord-anthropic-2025
    name: Concord Music Group, Inc. v. Anthropic PBC
    docket: 5:24-cv-03811
    court: cand
    year: 2025
    judge: Lee
    layer: modern
