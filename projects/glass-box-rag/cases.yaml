      does not cite US precedent and would pollute the citation graph.
  - name: UMG / Concord v. Suno & Udio
    reason: No merits opinion — resolved commercially (settlements Oct-Nov 2025).
  - name: Disney & Universal v. Midjourney
    reason: Discovery rulings only, no merits opinion.
