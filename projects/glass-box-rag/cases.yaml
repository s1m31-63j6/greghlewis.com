  # --- secondary-liability + ingestion lineage (added 2026-07-21) ---
  # Copyright ancestors that deepen the citation graph beyond the fair-use spine:
  # the inducement/vicarious branch behind Cox/Napster, and the pre-AI machine-
  # ingestion analogues the training cases actually reason from.
  - id: grokster-2005
    name: Metro-Goldwyn-Mayer Studios Inc. v. Grokster, Ltd.
    citation: 545 U.S. 913
    court: scotus
    year: 2005
    date: 2005-06-27
    layer: ancestor
    source: courtlistener
    note: |
      Inducement rule for secondary liability — distributing a tool with the object of
      promoting infringement. The active-inducement pole against Sony Betamax's passive
      safe harbor; Cox v. Sony (2026) reads both.

  - id: gershwin-1971
    name: Gershwin Publishing Corp. v. Columbia Artists Management, Inc.
    citation: 443 F.2d 1159
    court: ca2
    year: 1971
    layer: ancestor
    source: courtlistener
    note: |
      Origin of the vicarious-liability test: right and ability to supervise + a direct
      financial interest. Ancestor to Napster, Grokster, and Cox.

  - id: iparadigms-2009
    name: A.V. ex rel. Vanderhye v. iParadigms, LLC
    citation: 562 F.3d 630
    court: ca4
    year: 2009
    date: 2009-04-16
    layer: ancestor
    source: url
    url: https://www.ca4.uscourts.gov/opinions/Published/081424.P.pdf
    note: |
      Turnitin's automated ingestion of student papers to build a plagiarism-detection
      database held transformative fair use. The closest pre-AI analogue to training-data
      ingestion — a fair-use case that SHOULD retrieve alongside Bartz/HathiTrust.

  - id: netcom-1995
    name: Religious Technology Center v. Netcom On-Line Communication Services, Inc.
    citation: 907 F. Supp. 1361
    court: cand
    year: 1995
    date: 1995-11-21
    layer: ancestor
    source: courtlistener
    note: |
      Origin of the "volitional conduct" requirement for direct infringement — an
      intermediary that automatically copies user-transmitted material is not itself a
      direct infringer. Load-bearing for output-infringement theories against generative models.

modern:
  # --- Tier A: the only three actual fair-use merits rulings that exist ---
  - id: ross-2025
    name: Thomson Reuters Enterprise Centre GmbH v. Ross Intelligence Inc.
    citation: 765 F. Supp. 3d 382
    court: ded
    year: 2025
    date: 2025-02-11
    judge: Bibas
    layer: modern
    source: url
    url: https://www.ded.uscourts.gov/sites/ded/files/opinions/20-613_5.pdf
    govinfo_package: USCOURTS-ded-1_20-cv-00613
    note: |
      Fair use REJECTED. Held 2,243 Westlaw headnotes protectable. Non-generative AI.
      Thematically central: the proprietary editorial layer we deliberately exclude is
      the very thing this case is about. 3d Cir. appeal argued 2026-06-11, undecided.

  - id: bartz-2025
    name: Bartz v. Anthropic PBC
    docket: 3:24-cv-05417
    court: cand
    year: 2025
    date: 2025-06-23
    judge: Alsup
    layer: modern
    source: govinfo
    govinfo_package: USCOURTS-cand-3_24-cv-05417
    note: |
      Training "exceedingly transformative" = fair use. Retention of ~7M pirated books
      is NOT. Pairs with Kadrey (2 days later, opposite factor-4 reasoning).

  - id: kadrey-2025
    name: Kadrey v. Meta Platforms, Inc.
    docket: 3:23-cv-03417
    court: cand
    year: 2025
    date: 2025-06-25
    judge: Chhabria
    layer: modern
    source: govinfo
