# Glass Box RAG — corpus manifest
#
# Two acquisition paths, because they genuinely differ:
#   source: courtlistener  -> clean text + citation edges + parallel cites + precedential status
#   source: govinfo        -> PDF text + MODS metadata; NO citation edges (we extract them)
#   source: url            -> direct fetch from a court/official site (gap-fill)
#
# `layer` drives retrieval metadata and the citation-network visualization:
#   modern   = the generative-AI cases
#   ancestor = the fair-use lineage those cases argue over
#
# `binding_on` is deliberate: legal retrieval should distinguish binding from persuasive
# authority. SCOTUS binds everyone; a circuit binds its own districts; a district court
# binds no one.

