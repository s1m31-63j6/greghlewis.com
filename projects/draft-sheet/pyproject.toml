[project]
name = "draft-sheet"
version = "0.1.0"
description = "Draft Sheet for Casuals — consensus tiers, multi-platform ADP, and the offseason briefing for people who did not follow the offseason."
requires-python = ">=3.12"
dependencies = [
    # ADP + rankings fetching. httpx for the JSON APIs, requests for the
    # nflverse/DynastyProcess CSV mirrors that redirect through GitHub.
    "httpx>=0.27",
    "requests>=2.32",
    # Backoff for the undocumented endpoints, which are the ones that will flake.
    "tenacity>=8.2",
    # Joins across five ADP/ranking sources and the id crosswalk.
    "pandas>=2.2",
    "pyarrow>=16",
    # nflverse rosters + draft picks + team marks for the offseason tab.
    "nflreadpy>=0.1.5",
    "numpy>=1.26",
    # Progress over the per-player ADP history pull (271 sequential calls).
    "rich>=13.7",
]

[dependency-groups]
dev = ["ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py312"
